name: ucheck
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  go_router: ^14.0.0
  supabase_flutter: ^2.8.0
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  intl: ^0.19.0
  syncfusion_flutter_calendar: ^25.2.7+1
  pdf: ^3.10.8
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/big_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
